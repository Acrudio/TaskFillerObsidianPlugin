name: Release

on:
  # Cut a release by pushing a tag matching the version in manifest.json,
  # or by running this workflow from the Actions tab, which creates the tag.
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          # BRAT matches a release to a plugin by version, so a tag that
          # disagrees with the manifest would publish an uninstallable release.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match manifest.json version '$VERSION'." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
